version: '3.8'

services:
  kalshi-evo:
    build: .
    container_name: kalshi-evo
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./memory:/app/memory
      - ./logs:/app/logs
      - ./secrets:/app/secrets:ro
    command: python src/orchestrator.py

  dashboard:
    build: .
    container_name: kalshi-dashboard
    restart: unless-stopped
    env_file: .env
    ports:
      - "8081:8080"
    volumes:
      - ./memory:/app/memory:ro
      - ./logs:/app/logs:ro
    command: python src/monitoring/dashboard.py
